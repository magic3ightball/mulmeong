<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>물멍 — 미니 생태계 어항</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    font-family: 'Apple SD Gothic Neo', 'Pretendard', system-ui, sans-serif;
    background: radial-gradient(ellipse at 50% 30%, #2a2438 0%, #171320 55%, #0d0a14 100%);
    color:#e8e2d5;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    overflow:hidden;
    user-select:none; -webkit-user-select:none;
  }
  #stage { position:relative; }
  canvas { display:block; border-radius:16px; cursor:crosshair; }

  /* stats card */
  #stats {
    position:absolute; top:14px; left:14px;
    background:rgba(13,10,20,.55); backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.08);
    border-radius:12px; padding:12px 14px;
    font-size:12.5px; line-height:1.9; min-width:150px;
    pointer-events:none;
  }
  #stats b { font-weight:600; }
  .bar { display:inline-block; width:64px; height:7px; border-radius:4px;
         background:rgba(255,255,255,.12); vertical-align:middle; margin-left:6px; overflow:hidden;}
  .bar i { display:block; height:100%; border-radius:4px; transition:width .4s; }
  #o2bar i { background:#7fc8e8; } #nubar i { background:#c8a86a; } #bacbar i { background:#a06ac8; }

  /* toolbar */
  #tools {
    position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
    display:flex; gap:8px;
    background:rgba(13,10,20,.55); backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.08);
    border-radius:14px; padding:8px;
  }
  .tool {
    border:none; border-radius:10px; padding:8px 12px;
    background:transparent; color:#e8e2d5; font-size:13px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    transition:background .15s;
    font-family:inherit;
  }
  .tool span.ico { font-size:20px; }
  .tool span.lbl { font-size:10.5px; opacity:.75; }
  .tool:hover { background:rgba(255,255,255,.08); }
  .tool.sel { background:rgba(127,200,232,.18); outline:1px solid rgba(127,200,232,.45); }

  #side {
    position:absolute; top:14px; right:14px; display:flex; flex-direction:column; gap:8px;
  }
  .mini {
    border:none; border-radius:10px; padding:7px 11px;
    background:rgba(13,10,20,.55); color:#e8e2d5; font-size:12px; cursor:pointer;
    border:1px solid rgba(255,255,255,.08); backdrop-filter:blur(8px);
    font-family:inherit;
  }
  .mini:hover { background:rgba(255,255,255,.1); }

  #toast {
    position:absolute; top:60px; left:50%; transform:translateX(-50%);
    background:rgba(13,10,20,.7); border:1px solid rgba(255,255,255,.1);
    padding:8px 16px; border-radius:20px; font-size:13px;
    opacity:0; transition:opacity .4s; pointer-events:none; white-space:nowrap;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="900" height="900"></canvas>
  <div id="stats"></div>
  <div id="tools"></div>
  <div id="side">
    <button class="mini" id="speedBtn">▶ 1x</button>
    <button class="mini" id="resetBtn">↺ 어항 리셋</button>
  </div>
  <div id="toast"></div>
</div>

<script>
'use strict';
// ═════════════════════════════════════════════════════════════════
// 물멍 (Mulmeong) — a tiny closed-loop aquarium you keep alive.
// light → plants → fish → waste → bacteria → nutrients → plants …
// ═════════════════════════════════════════════════════════════════

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

// bowl geometry
const CX = W/2, CY = H/2 + 20, R = 375;
const R_IN = R - 10;
const WATER_Y = CY - R*0.58;               // waterline
const SAND_Y  = CY + R*0.60;               // sand surface (roughly)
const DAY_LEN = 90;                        // seconds per day

const SAVE_KEY = 'mulmeong-v1';

// ── world state ──────────────────────────────────────────────────
let world;
function freshWorld() {
  return {
    t: 0, day: 1,
    o2: 0.8, nutrients: 1.2, bacteria: 0.15,
    plants: [], fish: [], shrimp: [], pellets: [], detritus: [],
  };
}

// deterministic-ish helpers
const rnd = (a,b)=> a + Math.random()*(b-a);
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const dist2 = (ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};

function sandXRange(){ return R*0.72; }
function sandSurfaceY(x){
  const u = (x-CX)/sandXRange();
  return SAND_Y - 14*Math.cos(u*2.2) - 6*Math.sin(u*5.1);
}
function inWater(x,y){
  const d = Math.hypot(x-CX, y-CY);
  return d < R_IN-6 && y > WATER_Y+6 && y < sandSurfaceY(x)-4;
}

// ── entity factories ─────────────────────────────────────────────
function makePlant(x){
  x = clamp(x, CX-sandXRange()+20, CX+sandXRange()-20);
  return { x, y: sandSurfaceY(x), segs: 5, growth: 0, sway: rnd(0,6.28), hue: rnd(95,135) };
}
function makeFish(x,y,size,age){
  return {
    x, y, vx: rnd(-20,20), vy: 0,
    size: size || rnd(0.85,1.15), age: age || 0,
    hue: rnd(0,360), hunger: 0.3, hp: 1, breedCd: 0,
    heading: rnd(0,6.28), turn: 0, wig: rnd(0,6.28),
    gasp: false,
  };
}
function makeShrimp(x){
  x = clamp(x, CX-sandXRange()+30, CX+sandXRange()-30);
  return { x, y: sandSurfaceY(x)-6, dir: Math.random()<.5?-1:1, fed: 0.5, hop: 0, wig: rnd(0,6.28) };
}
function makePellet(x,y){ return { x, y, vy: 12, life: 35 }; }
function makeDetritus(x,y,amt){ return { x, y, vy: 8, amount: amt }; }

function seedTank(){
  world = freshWorld();
  world.plants.push(makePlant(CX-150), makePlant(CX+20), makePlant(CX+180));
  world.fish.push(makeFish(CX-60, CY, 1, 60), makeFish(CX+80, CY-40, 0.9, 60));
  world.shrimp.push(makeShrimp(CX-40));
}

// ── persistence ──────────────────────────────────────────────────
function save(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(world)); } catch(e){}
}
function load(){
  try {
    const s = localStorage.getItem(SAVE_KEY);
    if (!s) return false;
    const w = JSON.parse(s);
    if (!w || !Array.isArray(w.fish)) return false;
    for (const f of w.fish){ if (f.breedCd === undefined) f.breedCd = 0; }
    world = w;
    return true;
  } catch(e){ return false; }
}
setInterval(save, 5000);

// ── simulation ───────────────────────────────────────────────────
let bubbles = [], specks = [], ripples = [];
for (let i=0;i<40;i++) specks.push({x:rnd(CX-R_IN,CX+R_IN), y:rnd(WATER_Y+20,SAND_Y-20), p:rnd(0,6.28)});

function lightLevel(){
  const u = (world.t % DAY_LEN) / DAY_LEN;          // 0..1 through the day
  const sun = Math.max(0, Math.sin(u*Math.PI*2 - Math.PI/2)*0.5+0.5); // dawn→noon→dusk
  return 0.18 + 0.82*sun;                            // lamp keeps a floor
}

function step(dt){
  const w = world;
  const prevDayIdx = Math.floor(w.t / DAY_LEN);
  w.t += dt;
  if (Math.floor(w.t / DAY_LEN) > prevDayIdx) w.day++;

  const light = lightLevel();
  let plantMass = 0;
  for (const p of w.plants) plantMass += p.segs;

  // — plants photosynthesize and grow —
  let o2In = 0, nutOut = 0;
  for (let i=w.plants.length-1; i>=0; i--){
    const p = w.plants[i];
    const eff = light * clamp(w.nutrients, 0, 1.2);
    o2In += p.segs * eff * 0.004 * dt;
    if (p.segs < 14){
      p.growth += eff * 0.05 * dt;
      if (p.growth > 1 && w.nutrients > 0.15){
        p.growth = 0; p.segs++; nutOut += 0.06;
      }
    }
    // starving plants wither
    if (w.nutrients < 0.03 && Math.random() < 0.004*dt){
      p.segs--;
      w.detritus.push(makeDetritus(p.x+rnd(-8,8), p.y - p.segs*13, 0.35));
      if (p.segs <= 0) w.plants.splice(i,1);
    }
    // plants release a bubble sometimes
    if (light > 0.5 && Math.random() < p.segs*0.0012*dt*60/60){
      bubbles.push({x:p.x+rnd(-6,6), y:p.y - p.segs*13, r:rnd(1.5,3.5), vy:rnd(28,44), w:rnd(0,6.28)});
    }
  }

  // — pellets sink & dissolve —
  for (let i=w.pellets.length-1; i>=0; i--){
    const pe = w.pellets[i];
    pe.vy = Math.min(pe.vy + 6*dt, 26);
    pe.y += pe.vy*dt;
    const floor = sandSurfaceY(pe.x)-4;
    if (pe.y > floor){ pe.y = floor; pe.vy = 0; }
    pe.life -= dt;
    if (pe.life <= 0){
      w.detritus.push(makeDetritus(pe.x, pe.y, 0.5));
      w.pellets.splice(i,1);
    }
  }

  // — fish —
  const fishCount = w.fish.length;
  let o2Use = 0;
  for (let i=w.fish.length-1; i>=0; i--){
    const f = w.fish[i];
    f.age += dt; f.wig += dt*8;
    f.hunger = clamp(f.hunger + 0.009*dt*f.size, 0, 1.4);
    o2Use += 0.0035 * f.size * dt;

    // behavior: gasp at surface when O2 is low, hunt when hungry, else wander
    f.gasp = w.o2 < 0.22;
    let tx=null, ty=null, speed = 55;
    if (f.gasp){ tx = f.x; ty = WATER_Y + 18; speed = 70; }
    else if (f.hunger > 0.45){
      // nearest pellet, else nibble a plant tip
      let best=null, bd=1e12;
      for (const pe of w.pellets){ const d=dist2(f.x,f.y,pe.x,pe.y); if(d<bd){bd=d;best=pe;} }
      if (best){ tx=best.x; ty=best.y; speed=95;
        if (bd < 20*20){ w.pellets.splice(w.pellets.indexOf(best),1); f.hunger = Math.max(0, f.hunger-0.5);
          w.detritus.push(makeDetritus(f.x, f.y+6, 0.12)); }
      } else {
        let bp=null; bd=1e12;
        const minSegs = f.hunger > 0.9 ? 2 : 3;   // desperate fish graze lower
        for (const p of w.plants){ if(p.segs<minSegs) continue;
          const py=p.y-p.segs*13, d=dist2(f.x,f.y,p.x,py); if(d<bd){bd=d;bp=p;} }
        if (bp){ const py=bp.y-bp.segs*13; tx=bp.x; ty=py; speed=80;
          if (bd < 22*22){ bp.segs--; f.hunger = Math.max(0, f.hunger-0.35);
            w.detritus.push(makeDetritus(f.x, f.y+6, 0.1)); }
        }
      }
    }

    if (tx !== null){
      const a = Math.atan2(ty-f.y, tx-f.x);
      let da = a - f.heading;
      while (da > Math.PI) da -= Math.PI*2;
      while (da < -Math.PI) da += Math.PI*2;
      f.heading += clamp(da, -3.2*dt, 3.2*dt);
      // slow down on approach so the turn radius never out-orbits the food
      const td = Math.hypot(tx-f.x, ty-f.y);
      speed = clamp(td*1.4, 22, speed);
    } else {
      f.turn += (Math.random()-0.5)*2.4*dt;
      f.turn = clamp(f.turn, -0.9, 0.9);
      f.heading += f.turn*dt;
      speed = 38;
    }

    // keep inside the water
    const dC = Math.hypot(f.x-CX, f.y-CY);
    if (dC > R_IN-40){
      const a = Math.atan2(CY-f.y, CX-f.x);
      let da = a - f.heading;
      while (da > Math.PI) da -= Math.PI*2;
      while (da < -Math.PI) da += Math.PI*2;
      f.heading += clamp(da, -3.5*dt, 3.5*dt);
    }
    f.x += Math.cos(f.heading)*speed*f.size*dt + f.vx*dt;
    f.y += Math.sin(f.heading)*speed*f.size*dt + f.vy*dt;
    f.vx *= Math.pow(0.2, dt); f.vy *= Math.pow(0.2, dt);
    f.y = clamp(f.y, WATER_Y+16, sandSurfaceY(f.x)-14);
    const dC2 = Math.hypot(f.x-CX, f.y-CY);
    if (dC2 > R_IN-14){ const a=Math.atan2(f.y-CY,f.x-CX); f.x=CX+Math.cos(a)*(R_IN-14); f.y=CY+Math.sin(a)*(R_IN-14); }

    // health
    if (f.hunger >= 1.25 || w.o2 <= 0.05) f.hp -= 0.05*dt;
    else if (f.hp < 1) f.hp += 0.02*dt;
    if (f.hp <= 0){
      w.detritus.push(makeDetritus(f.x, f.y, 0.9*f.size));
      w.fish.splice(i,1);
      toast('물고기 한 마리가 죽었어요… 🫧');
      continue;
    }
    // fry slowly grow into adults
    f.size = Math.min(f.size + 0.0035*dt, 1.15);
    // breeding: well fed, grown adult, room in the tank, and a rest between broods
    f.breedCd = Math.max(0, (f.breedCd || 0) - dt);
    if (f.age > 75 && f.size > 0.85 && f.hunger < 0.3 && f.breedCd <= 0 &&
        w.fish.length < 12 && w.o2 > 0.5 &&
        plantMass > (w.fish.length+1)*5 &&        // only breed if the tank can feed another mouth
        Math.random() < 0.004*dt){
      w.fish.push(makeFish(f.x+rnd(-10,10), f.y+rnd(-10,10), 0.5, 0));
      f.breedCd = 40;
      f.hunger += 0.3;
      toast('치어가 태어났어요! 🐟');
    }
  }

  // — shrimp clean the floor —
  for (let i=w.shrimp.length-1; i>=0; i--){
    const s = w.shrimp[i];
    s.wig += dt*6;
    s.fed = clamp(s.fed - 0.004*dt, 0, 1);
    // walk toward nearest detritus on the sand
    let best=null, bd=1e12;
    for (const d of w.detritus){ const dd=dist2(s.x,0,d.x,0); if(dd<bd){bd=dd;best=d;} }
    if (best && Math.abs(best.x-s.x) > 8) s.dir = best.x > s.x ? 1 : -1;
    else if (Math.random() < 0.5*dt) s.dir *= -1;
    s.x += s.dir * 22 * dt;
    s.x = clamp(s.x, CX-sandXRange()+24, CX+sandXRange()-24);
    s.y = sandSurfaceY(s.x)-6;
    // no waste around? sift the sand for scraps
    if (!best && s.fed < 0.35 && Math.random() < 0.25*dt) s.fed += 0.04;
    if (best && Math.abs(best.x-s.x) < 12 && best.y > sandSurfaceY(best.x)-20){
      const bite = Math.min(best.amount, 0.4*dt);
      best.amount -= bite;
      w.nutrients += bite*0.8;      // shrimp turn waste into fine nutrients fast
      s.fed = clamp(s.fed + bite*2, 0, 1);
    }
    o2Use += 0.0006*dt;
    if (s.fed >= 0.95 && w.shrimp.length < 6 && Math.random() < 0.004*dt){
      w.shrimp.push(makeShrimp(s.x+rnd(-20,20)));
      s.fed = 0.4;
      toast('새우가 늘었어요 🦐');
    }
    if (s.fed <= 0 && Math.random() < 0.01*dt){
      w.detritus.push(makeDetritus(s.x, s.y, 0.25));
      w.shrimp.splice(i,1);
      toast('새우가 굶어 죽었어요… 🦐');
    }
  }

  // — detritus sinks; bacteria decompose it into nutrients (using O2) —
  let totalDet = 0;
  for (let i=w.detritus.length-1; i>=0; i--){
    const d = w.detritus[i];
    const floor = sandSurfaceY(d.x)-3;
    if (d.y < floor){ d.vy = Math.min(d.vy + 5*dt, 18); d.y += d.vy*dt; if (d.y>floor) d.y=floor; }
    totalDet += d.amount;
    const rate = w.bacteria * 0.06 * dt;
    const dec = Math.min(d.amount, rate);
    d.amount -= dec;
    w.nutrients += dec*0.9;
    o2Use += dec*0.15;
    if (d.amount <= 0.02) w.detritus.splice(i,1);
  }
  // bacteria population follows the food supply
  const bacTarget = clamp(totalDet*0.5 + 0.1, 0.1, 1);
  w.bacteria += (bacTarget - w.bacteria) * 0.1 * dt;

  // — resources —
  w.o2 = clamp(w.o2 + o2In - o2Use + 0.0007*dt /*surface exchange*/ , 0, 1);
  if (world.fish.length===0 && world.shrimp.length===0) w.o2 = clamp(w.o2 + 0.002*dt, 0, 1);
  w.nutrients = clamp(w.nutrients - nutOut, 0, 4);

  // — ambience —
  for (const b of bubbles){ b.y -= b.vy*dt; b.x += Math.sin(b.w += dt*5)*8*dt; }
  bubbles = bubbles.filter(b => b.y > WATER_Y + 8);
  for (const sp of specks){
    sp.p += dt*0.5;
    sp.x += Math.sin(sp.p)*3*dt; sp.y += Math.cos(sp.p*0.7)*2*dt;
    if (!inWater(sp.x, sp.y)){ sp.x = rnd(CX-R_IN*0.7, CX+R_IN*0.7); sp.y = rnd(WATER_Y+30, SAND_Y-30); }
  }
  for (const r of ripples) r.a -= dt*1.4;
  ripples = ripples.filter(r => r.a > 0);
}

// ── rendering ────────────────────────────────────────────────────
function render(){
  const light = lightLevel();
  ctx.clearRect(0,0,W,H);

  // room shadow under the bowl
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.beginPath(); ctx.ellipse(CX, CY+R*0.92, R*0.8, 34, 0, 0, 7); ctx.fill();
  ctx.restore();

  // glass back
  const glass = ctx.createRadialGradient(CX-R*0.3, CY-R*0.4, R*0.2, CX, CY, R);
  glass.addColorStop(0, 'rgba(70,90,110,0.35)');
  glass.addColorStop(1, 'rgba(25,32,45,0.55)');
  ctx.fillStyle = glass;
  ctx.beginPath(); ctx.arc(CX, CY, R, 0, 7); ctx.fill();

  // clip to bowl for everything watery
  ctx.save();
  ctx.beginPath(); ctx.arc(CX, CY, R_IN, 0, 7); ctx.clip();

  // water body
  const wat = ctx.createLinearGradient(0, WATER_Y, 0, CY+R);
  const dayTint = 40 + light*60;
  wat.addColorStop(0, `rgba(${30+dayTint*0.6},${90+dayTint*0.9},${120+dayTint},0.92)`);
  wat.addColorStop(1, `rgba(${12+dayTint*0.2},${40+dayTint*0.35},${60+dayTint*0.5},0.96)`);
  ctx.fillStyle = wat;
  ctx.fillRect(CX-R, WATER_Y, R*2, R*2);

  // light rays from above
  if (light > 0.3){
    ctx.save();
    ctx.globalAlpha = (light-0.3)*0.35;
    for (let i=0;i<4;i++){
      const rx = CX - R*0.5 + i*R*0.33 + Math.sin(world.t*0.15+i)*20;
      const g = ctx.createLinearGradient(rx, WATER_Y, rx+70, CY+R*0.5);
      g.addColorStop(0,'rgba(255,244,200,0.5)'); g.addColorStop(1,'rgba(255,244,200,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(rx, WATER_Y); ctx.lineTo(rx+46, WATER_Y);
      ctx.lineTo(rx+150, CY+R*0.55); ctx.lineTo(rx+40, CY+R*0.55);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  // drifting specks
  ctx.fillStyle = 'rgba(230,240,240,0.16)';
  for (const sp of specks){ ctx.beginPath(); ctx.arc(sp.x, sp.y, 1.4, 0, 7); ctx.fill(); }

  // sand
  ctx.beginPath();
  ctx.moveTo(CX-R, CY+R);
  for (let x=CX-R; x<=CX+R; x+=8) ctx.lineTo(x, sandSurfaceY(clamp(x, CX-sandXRange(), CX+sandXRange())));
  ctx.lineTo(CX+R, CY+R); ctx.closePath();
  const sg = ctx.createLinearGradient(0, SAND_Y-30, 0, CY+R);
  sg.addColorStop(0, '#cbb98e'); sg.addColorStop(1, '#8f7d58');
  ctx.fillStyle = sg; ctx.fill();
  // sand grain dots
  ctx.fillStyle = 'rgba(90,74,50,0.25)';
  for (let i=0;i<60;i++){
    const gx = CX + Math.sin(i*12.9898)*sandXRange()*0.95;
    const gy = sandSurfaceY(gx) + 8 + (i*37%40);
    ctx.fillRect(gx, gy, 2, 2);
  }

  // detritus
  for (const d of world.detritus){
    ctx.fillStyle = 'rgba(88,70,48,0.85)';
    const r = 2 + d.amount*5;
    ctx.beginPath(); ctx.arc(d.x, d.y, r, 0, 7); ctx.fill();
  }

  // pellets
  ctx.fillStyle = '#e0a44e';
  for (const pe of world.pellets){ ctx.beginPath(); ctx.arc(pe.x, pe.y, 3.4, 0, 7); ctx.fill(); }

  // plants — swaying strands
  for (const p of world.plants){
    const sway = Math.sin(world.t*1.1 + p.sway)*0.35;
    ctx.strokeStyle = `hsl(${p.hue}, 45%, ${30+lightLevel()*14}%)`;
    ctx.lineWidth = 5; ctx.lineCap = 'round';
    for (let s=-1;s<=1;s++){
      ctx.beginPath();
      ctx.moveTo(p.x+s*5, p.y);
      let px = p.x+s*5, py = p.y;
      for (let k=1;k<=p.segs;k++){
        const ang = -Math.PI/2 + sway*Math.sin(k*0.6 + world.t*1.3 + p.sway) * (k/p.segs) + s*0.12;
        px += Math.cos(ang)*13; py += Math.sin(ang)*13;
        ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
  }

  // shrimp
  for (const s of world.shrimp){
    ctx.save();
    ctx.translate(s.x, s.y + Math.sin(s.wig)*1.5);
    ctx.scale(s.dir, 1);
    ctx.fillStyle = '#e8907a';
    ctx.beginPath();
    ctx.ellipse(0, 0, 9, 5, -0.3, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-7, 2, 5, 3.5, 0.5, 0, 7); ctx.fill();
    ctx.strokeStyle = '#e8907a'; ctx.lineWidth = 1.2;
    for (let l=0;l<3;l++){
      ctx.beginPath(); ctx.moveTo(-2+l*3, 4);
      ctx.lineTo(-4+l*3, 8 + Math.sin(s.wig+l)*1.5); ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(8,-2); ctx.lineTo(14,-6); ctx.stroke();
    ctx.fillStyle = '#40282a';
    ctx.beginPath(); ctx.arc(6.5, -1.5, 1.1, 0, 7); ctx.fill();
    ctx.restore();
  }

  // fish
  for (const f of world.fish){
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(Math.abs(((f.heading%6.283)+6.283)%6.283 - 3.1416) < 1.5708 ? f.heading : f.heading);
    const flip = Math.cos(f.heading) < 0;
    if (flip){ ctx.rotate(Math.PI); ctx.scale(-1,1); ctx.rotate(-Math.PI); ctx.scale(-1,-1); ctx.scale(-1,1); }
    const sz = 13*f.size * (0.55 + 0.45*Math.min(f.age/75,1));
    const tail = Math.sin(f.wig)*0.5;
    const bodyL = f.gasp ? 62 : (48 + f.hunger*20);
    ctx.fillStyle = `hsl(${f.hue}, ${f.hp>0.5?62:30}%, ${58 - f.hunger*8}%)`;
    // tail
    ctx.beginPath();
    ctx.moveTo(-sz*0.9, 0);
    ctx.lineTo(-sz*1.7, -sz*0.62 + tail*sz*0.5);
    ctx.lineTo(-sz*1.7, sz*0.62 + tail*sz*0.5);
    ctx.closePath(); ctx.fill();
    // body
    ctx.beginPath(); ctx.ellipse(0, 0, sz, sz*0.62, 0, 0, 7); ctx.fill();
    // fin
    ctx.fillStyle = `hsla(${f.hue}, 62%, 48%, .8)`;
    ctx.beginPath();
    ctx.moveTo(0,-sz*0.5); ctx.quadraticCurveTo(sz*0.3, -sz*1.05, sz*0.55, -sz*0.45);
    ctx.closePath(); ctx.fill();
    // eye
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(sz*0.55, -sz*0.12, sz*0.2, 0, 7); ctx.fill();
    ctx.fillStyle = '#1c1c22';
    ctx.beginPath(); ctx.arc(sz*0.6, -sz*0.12, sz*0.11, 0, 7); ctx.fill();
    // gasping mouth bubbles
    if (f.gasp && Math.random()<0.06){
      bubbles.push({x:f.x+Math.cos(f.heading)*sz, y:f.y, r:1.6, vy:34, w:0});
    }
    ctx.restore();
  }

  // bubbles
  ctx.strokeStyle = 'rgba(230,246,255,0.55)';
  ctx.lineWidth = 1.2;
  for (const b of bubbles){ ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.stroke(); }

  // stir ripples
  for (const r of ripples){
    ctx.strokeStyle = `rgba(210,235,245,${r.a*0.35})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(r.x, r.y, (1-r.a)*44+6, 0, 7); ctx.stroke();
  }

  // waterline
  const halfw = Math.sqrt(Math.max(0, R_IN*R_IN - (WATER_Y-CY)*(WATER_Y-CY)));
  ctx.strokeStyle = 'rgba(235,250,255,0.5)';
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.ellipse(CX, WATER_Y, halfw, 10, 0, 0, 7); ctx.stroke();
  ctx.fillStyle = 'rgba(190,225,240,0.10)';
  ctx.beginPath(); ctx.ellipse(CX, WATER_Y, halfw, 10, 0, 0, 7); ctx.fill();

  ctx.restore(); // unclip

  // glass rim + highlight
  ctx.strokeStyle = 'rgba(200,225,245,0.35)';
  ctx.lineWidth = 6;
  ctx.beginPath(); ctx.arc(CX, CY, R, 0, 7); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 10; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(CX, CY, R-14, -2.3, -1.75); ctx.stroke();
  ctx.beginPath(); ctx.arc(CX, CY, R-14, 0.6, 0.95); ctx.stroke();

  // day/night dial (little sun/moon over the bowl)
  const u = (world.t % DAY_LEN)/DAY_LEN;
  const dialA = -Math.PI/2 + u*Math.PI*2;
  const dx = CX + Math.cos(dialA)* (R+26), dy = CY + Math.sin(dialA)*(R+26);
  if (dy < CY){
    ctx.font = '20px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(light > 0.5 ? '☀️' : '🌙', dx, dy);
  }
}

// ── UI ───────────────────────────────────────────────────────────
const TOOLS = [
  { id:'feed',   ico:'🍞', lbl:'먹이' },
  { id:'fish',   ico:'🐟', lbl:'물고기' },
  { id:'shrimp', ico:'🦐', lbl:'새우' },
  { id:'plant',  ico:'🌿', lbl:'수초' },
  { id:'stir',   ico:'👋', lbl:'물 젓기' },
];
let tool = 'feed';
const toolsEl = document.getElementById('tools');
for (const t of TOOLS){
  const b = document.createElement('button');
  b.className = 'tool' + (t.id===tool?' sel':'');
  b.innerHTML = `<span class="ico">${t.ico}</span><span class="lbl">${t.lbl}</span>`;
  b.onclick = ()=>{ tool = t.id;
    document.querySelectorAll('.tool').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');
  };
  toolsEl.appendChild(b);
}

let toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.opacity = 1;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.style.opacity = 0, 2400);
}

function canvasPos(e){
  const r = cv.getBoundingClientRect();
  return { x:(e.clientX-r.left)*(W/r.width), y:(e.clientY-r.top)*(H/r.height) };
}

let dragging = false, lastStir = 0;
cv.addEventListener('pointerdown', e=>{
  dragging = true;
  const {x,y} = canvasPos(e);
  useTool(x,y,e);
});
cv.addEventListener('pointermove', e=>{
  if (!dragging) return;
  const {x,y} = canvasPos(e);
  if (tool==='stir') stir(x,y,e);
  else if (tool==='feed' && performance.now()-lastStir > 120){ lastStir=performance.now(); useTool(x,y,e); }
});
window.addEventListener('pointerup', ()=> dragging=false);

function useTool(x,y,e){
  if (tool==='stir'){ stir(x,y,e); return; }
  if (!inWater(x,y) && tool!=='plant' && tool!=='shrimp'){
    if (Math.hypot(x-CX,y-CY) > R) return;
  }
  const w = world;
  if (tool==='feed'){
    if (y < WATER_Y+30) y = WATER_Y+30;
    for (let i=0;i<3;i++) w.pellets.push(makePellet(x+rnd(-10,10), y+rnd(-6,6)));
  } else if (tool==='fish'){
    if (w.fish.length >= 15){ toast('어항이 너무 붐벼요! (최대 15마리)'); return; }
    w.fish.push(makeFish(clamp(x,CX-R_IN+40,CX+R_IN-40), clamp(y,WATER_Y+30,SAND_Y-30), 1, 60));
  } else if (tool==='shrimp'){
    if (w.shrimp.length >= 8){ toast('새우는 8마리까지!'); return; }
    w.shrimp.push(makeShrimp(x));
  } else if (tool==='plant'){
    if (w.plants.length >= 9){ toast('수초는 9포기까지!'); return; }
    w.plants.push(makePlant(x));
  }
}

function stir(x,y,e){
  if (!inWater(x,y)) return;
  const now = performance.now();
  if (now - lastStir < 60) return;
  lastStir = now;
  ripples.push({x,y,a:1});
  const mx = (e.movementX||0)*2.5, my = (e.movementY||0)*2.5;
  for (const f of world.fish){
    const d = Math.hypot(f.x-x, f.y-y);
    if (d < 160){ const k = (1-d/160); f.vx += mx*k*3; f.vy += my*k*3; }
  }
  for (const b of bubbles){ const d=Math.hypot(b.x-x,b.y-y); if (d<120) b.x += mx*0.4; }
  for (const pe of world.pellets){ const d=Math.hypot(pe.x-x,pe.y-y); if (d<120){ pe.x += mx*0.5; pe.y += my*0.3; pe.vy = Math.max(pe.vy, 4);} }
}

// speed + reset
let speed = 1;
document.getElementById('speedBtn').onclick = function(){
  speed = speed===1 ? 4 : (speed===4 ? 0 : 1);
  this.textContent = speed===0 ? '⏸ 정지' : `▶ ${speed}x`;
};
document.getElementById('resetBtn').onclick = function(){
  if (!confirm('어항을 완전히 비우고 새로 시작할까요?')) return;
  localStorage.removeItem(SAVE_KEY);
  seedTank(); bubbles=[];
  toast('새 어항을 세팅했어요 🫧');
};

// stats
function renderStats(){
  const w = world;
  const pl = w.plants.reduce((a,p)=>a+p.segs,0);
  document.getElementById('stats').innerHTML =
    `<b>Day ${w.day}</b> &nbsp;${lightLevel()>0.5?'낮':'밤'}<br>` +
    `🐟 물고기 <b>${w.fish.length}</b> &nbsp; 🦐 <b>${w.shrimp.length}</b> &nbsp; 🌿 <b>${pl}</b><br>` +
    `산소 <span class="bar" id="o2bar"><i style="width:${(w.o2*100)|0}%"></i></span><br>` +
    `영양분 <span class="bar" id="nubar"><i style="width:${clamp(w.nutrients/2*100,0,100)|0}%"></i></span><br>` +
    `박테리아 <span class="bar" id="bacbar"><i style="width:${(w.bacteria*100)|0}%"></i></span>`;
}

// ── boot ─────────────────────────────────────────────────────────
if (!load()) seedTank();

// fit canvas to window
function fit(){
  const s = Math.min(window.innerWidth-40, window.innerHeight-40, 900);
  cv.style.width = s+'px'; cv.style.height = s+'px';
}
window.addEventListener('resize', fit); fit();

let last = performance.now(), statTick = 0;
function loop(now){
  let dt = Math.min((now-last)/1000, 0.05);
  last = now;
  if (speed > 0){
    for (let i=0;i<speed;i++) step(dt);
  }
  render();
  statTick += dt;
  if (statTick > 0.3){ statTick = 0; renderStats(); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
